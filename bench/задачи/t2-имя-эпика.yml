id: t2-имя-эпика
размер: малая
бюджет_usd: 1.2  # ≈ 1,5 × база $0,78 (сессия bf7a2af3); plexus-dsh-budget в профилях e04/e05
репо: plexus
репо_путь: ~/PycharmProjects/plexus
снимок: 3297997    # до решения
эталон: 0ecc993    # fix(старт): имя эпика и для строки «**E14** Имя — описание»
задание: |
  В plexus экран старта (lib/экран_старта.py, функция `эпики`) берёт имя эпика
  только из строки roadmap вида `- **E19 · Проводки** — описание`. У строк вида
  `- **E14** Логи для человека — описание · 11/16 · back` имя получается «E14», и
  экран показывает номер дважды («E14 E14»).

  Исправь: имя ищется по порядку
  1) в жирном после « · » (`**E19 · Проводки**` → «Проводки»);
  2) в тексте после жирного до первого « — », « · » или « (»
     (`**E14** Логи для человека — …` → «Логи для человека»);
  3) в имени подплана `.claude/plan/E13-<имя>.md` (часть после первого «-»);
  4) иначе — сам id эпика.
  Добавь случаи в самопроверку файла; `python3 lib/экран_старта.py --самопроверка` должна быть зелёной.
проверка: |
  python3 "$BENCH/проверки/t2_имя_эпика.py"
  python3 lib/экран_старта.py --самопроверка
