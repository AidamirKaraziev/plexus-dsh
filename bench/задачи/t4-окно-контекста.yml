id: t4-окно-контекста
размер: средняя
репо: plexus
репо_путь: ~/PycharmProjects/plexus
снимок: 3b28052    # до решения
эталон: 2db113d    # fix(контекст): окно 1M у моделей пятого поколения и opus/sonnet 4.6+
задание: |
  В plexus сторож контекста (lib/контекст.py) знает окна только claude-opus-4,
  claude-sonnet-4, claude-haiku-4, claude-3 и всем даёт 200k; claude-opus-5-5 не знает
  вовсе. Из-за этого порог 20 % срабатывает на 40k вместо 200k.

  Исправь таблицу окон по справочнику моделей Anthropic (первый совпавший префикс,
  частное выше общего):
  - 1M: claude-fable-5*, claude-mythos-5*, claude-opus-5*, claude-sonnet-5*, claude-haiku-5*,
    claude-opus-4-8, claude-opus-4-7, claude-opus-4-6, claude-sonnet-4-6;
  - 200k: прочие claude-opus-4*, claude-sonnet-4*, claude-haiku-4*, claude-3*;
  - суффикс [1m] по-прежнему даёт 1M; неизвестная модель — 200k;
  - новое правило: если занято больше окна, окно считается 1M (таблица отстала).
  Вывод и коды CLI не меняй (`контекст: 109k из 1M · 11 % · порог 20 % · ок`, код 1 — порог).
  Обнови самопроверку и шапку файла; `python3 lib/контекст.py --самопроверка` — зелёная.
проверка: |
  python3 "$BENCH/проверки/t4_окно_контекста.py"
  python3 lib/контекст.py --самопроверка
