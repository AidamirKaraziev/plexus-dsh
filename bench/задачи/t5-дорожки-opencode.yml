id: t5-дорожки-opencode
размер: большая
репо: plexus
репо_путь: ~/PycharmProjects/plexus
снимок: 369bf20    # «утверждено: дорожки opencode» (E34-S03) — до решения
эталон: aed9f77    # конец этапа 2
граница: |
  После этапа 1 прогонщик останавливает агента, проверяет этап 1
  (`bench/check.sh t5-дорожки-opencode --этап 1 --dir <каталог>`), затем даёт
  задание этапа 2 в том же каталоге. Проверка этапа 2 гоняет оба этапа.
этапы:
  - имя: дорожка.py — среда opencode
    эталон: a8dc909
    задание: |
      В plexus lib/дорожка.py заводит дорожку работника только для Codex:
      каталог `<репо>/.codex/worktrees/<имя>`, ветка `codex/<имя>`, `.codex/` в
      .git/info/exclude. Добавь среду OpenCode.
      - Флаг `--среда codex|opencode` (по умолчанию codex) для команд «завести» и «путь»:
        opencode → каталог `<репо>/.opencode/worktrees/<имя>`, ветка `opencode/<имя>`,
        строка `.opencode/` в .git/info/exclude (один раз).
      - Без флага поведение прежнее (codex).
      - «путь» только печатает путь: ни каталога, ни строки в exclude.
      - Плохое имя (не `[\w.-]+`) — код 2; повторный завод — код 1 и «уже есть» в stderr;
        завод изнутри другой дорожки находит main-checkout.
      - `python3 lib/дорожка.py --самопроверка` — самопроверка во временном git-репо,
        гоняющая сам скрипт через subprocess (по образцу lib/уборка.py).
      Обнови докстринг. Только дорожка.py; уборку не трогай — это этап 2.
    проверка: |
      python3 "$BENCH/lib/самопроверка_эталона.py" lib/дорожка.py
      python3 lib/дорожка.py --самопроверка
  - имя: уборка.py — опознаёт opencode/
    эталон: aed9f77
    задание: |
      Этап 2. lib/уборка.py опознаёт ветки работников по префиксам claude/, codex/ и
      worktree-agent-. Добавь opencode/ (дорожки из этапа 1):
      - префикс opencode/ в умолчаниях (и в справке `--префикс`);
      - влитая (cherry-pick'ом) дорожка opencode/ сносится, невлитая остаётся
        с «оставил: … — не влита в <ветка>»;
      - `--забрать` переносит коммиты «+» ветки opencode/ (`забрал бы: opencode/o — коммитов 1`
        в сухом прогоне, `забрал: opencode/o` при `--ветка opencode/o`).
      Расширь обе самопроверки уборки случаями opencode; `python3 lib/уборка.py --самопроверка` — зелёная.
      Обнови докстринг.
    проверка: |
      python3 "$BENCH/lib/самопроверка_эталона.py" lib/уборка.py
      python3 lib/уборка.py --самопроверка
